name: Build and Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Download Portable FFmpeg Binaries
        shell: powershell
        run: |
          Write-Host "Downloading standalone FFmpeg release from yt-dlp/FFmpeg-Builds..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          $binPath = Get-ChildItem -Path "ffmpeg_temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -ExpandProperty DirectoryName -First 1
          New-Item -ItemType Directory -Force -Path "ffmpeg"
          Copy-Item "$binPath\ffmpeg.exe" -Destination "ffmpeg\ffmpeg.exe"
          Copy-Item "$binPath\ffprobe.exe" -Destination "ffmpeg\ffprobe.exe"
          Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_temp"
          Write-Host "FFmpeg successfully prepared in .\ffmpeg"
          Get-ChildItem -Path "ffmpeg"

      - name: Build Executable with PyInstaller
        run: |
          python build_exe.py

      - name: Create Portable Zip Package
        shell: powershell
        run: |
          Compress-Archive -Path "dist/NovaDownloader/*" -DestinationPath "dist/NovaDownloader-Windows-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaDownloader-Windows-x64
          path: dist/NovaDownloader-Windows-x64.zip

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nova Downloader ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/NovaDownloader-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
